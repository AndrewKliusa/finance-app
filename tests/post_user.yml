info:
  name: post_user
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/v1/users"
  body:
    type: json
    data: |-
      {
        "name": "andrew",
        "password": "test1234"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.username
      operator: eq
      value: andrew

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
