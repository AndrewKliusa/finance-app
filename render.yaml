services:
  - type: web
    name: finance-api
    env: docker
    plan: free
    healthCheckPath: /api/v1/health
    dockerCommand: npm run migrate:deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_NOTIFICATIONS_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: worker
    name: notifications-worker
    env: docker
    plan: free
    dockerCommand: npx tsx workers/notifications.worker.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: REDIS_URL
        sync: false

  - type: worker
    name: reports-worker
    env: docker
    plan: free
    dockerCommand: npx tsx workers/reports.worker.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: REDIS_URL
        sync: false

databases:
  - name: finance-db
    plan: free
